map $http_x_forwarded_proto $panel_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $panel_proto;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location / { try_files $uri $uri/ /index.html; }
}
