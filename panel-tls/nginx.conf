limit_req_zone $binary_remote_addr zone=panel_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=panel_per_ip:10m rate=20r/s;
limit_req_zone "panel-global" zone=panel_global_rate:10m rate=250r/s;
limit_conn_zone $binary_remote_addr zone=panel_per_ip_conn:10m;
limit_conn_zone "panel-global" zone=panel_global_conn:10m;

server {
  listen 443 ssl;
  listen 8080 ssl;
  server_tokens off;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  error_page 497 =308 https://$http_host$request_uri;
  ssl_certificate /panel-tls/cert.pem;
  ssl_certificate_key /panel-tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  client_max_body_size 1m;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;
  access_log off;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req zone=panel_global_rate burst=500 nodelay;
  limit_conn panel_global_conn 500;
  limit_conn panel_per_ip_conn 30;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_buffering off;
  proxy_read_timeout 1h;

  include /panel-tls/access-path.conf;
}
